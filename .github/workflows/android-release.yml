name: Android Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 构建 arm64-v8a / armeabi-v7a Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 写入 local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # 未配置 KEYSTORE_BASE64 时生成一次性密钥，使工作流在 fork / 首次推送时也能产出可安装 APK。
      - name: 准备签名材料
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            STORE_PASSWORD="${KEYSTORE_PASSWORD:?缺少 KEYSTORE_PASSWORD}"
            ALIAS="${KEY_ALIAS:?缺少 KEY_ALIAS}"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "使用仓库 Secrets 中的正式签名密钥"
          else
            STORE_PASSWORD="ci-ephemeral-password"
            ALIAS="phonetics-ci"
            KEY_PASS="$STORE_PASSWORD"
            keytool -genkeypair -keystore release.jks -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASS" \
              -dname "CN=PhoneticsTV CI, OU=CI, O=PhoneticsTV, C=CN"
            echo "::warning::未配置 KEYSTORE_BASE64，本次 APK 由一次性密钥签名，仅供测试安装"
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: 代码风格与单元测试
        run: ./gradlew :app:ktlintCheck :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: 构建 Release APK（ABI 拆分）
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 校验产物
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/release
          ls -lh "$APK_DIR"/*.apk
          for abi in arm64-v8a armeabi-v7a; do
            test -f "$APK_DIR/app-$abi-release.apk" || { echo "缺少 app-$abi-release.apk"; exit 1; }
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify \
              "$APK_DIR/app-$abi-release.apk"
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: phonetics-tv-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
